services:
  - type: web
    name: legal-judgment-summarizer
    runtime: docker
    plan: starter # 1-2 GB RAM recommended for PyTorch CPU inference
    region: oregon
    envVars:
      - key: APP_ALLOW_UNAUTHENTICATED
        value: "true"
      - key: LEGAL_CPU_THREADS
        value: "2"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
